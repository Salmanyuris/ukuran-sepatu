<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hitung Ukuran Sepatu | ShoeFit</title>
    <meta name="description" content="Kalkulator ukuran sepatu berdasarkan tinggi badan. Temukan ukuran sepatu ideal kamu secara instan!" />
    <meta name="keywords" content="ukuran sepatu, kalkulator sepatu, shoe size calculator, tinggi badan, sepatu EU" />
    <meta name="author" content="Salman Yuris" />
    <meta property="og:title" content="ShoeFit — Hitung Ukuran Sepatu Kamu" />
    <meta property="og:description" content="Kalkulator ukuran sepatu berdasarkan tinggi badan. Cepat, akurat, dan gratis!" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ShoeFit — Hitung Ukuran Sepatu" />
    <meta name="twitter:description" content="Temukan ukuran sepatu ideal berdasarkan tinggi badanmu secara instan." />
    <meta name="theme-color" content="#0a0a0f" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <!-- Floating background orbs -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <!-- Floating shoe particles -->
    <div class="particles" aria-hidden="true">
      <span class="particle" style="--delay:0s;--x:10%;--y:20%">👟</span>
      <span class="particle" style="--delay:1.2s;--x:80%;--y:15%">👠</span>
      <span class="particle" style="--delay:2.4s;--x:55%;--y:75%">👞</span>
      <span class="particle" style="--delay:0.8s;--x:25%;--y:80%">👟</span>
      <span class="particle" style="--delay:3s;--x:90%;--y:60%">👡</span>
      <span class="particle" style="--delay:1.8s;--x:5%;--y:55%">👞</span>
    </div>

    <main id="kalkulator-sepatu">

      <!-- Logo from assets folder -->
      <div class="shoe-hero" aria-label="ShoeFit Logo">
        <img
          src="assets/sneakers-svgrepo-com.svg"
          alt="ShoeFit Sneaker Logo"
          class="shoe-logo"
          width="100"
          height="100"
        />
      </div>

      <!-- Header -->
      <div class="card-header">
        <div class="brand-badge">
          <img src="assets/sneakers-svgrepo-com.svg" alt="" class="badge-logo" width="16" height="16" />
          ShoeFit
        </div>
        <h1>Ukuran Sepatu Kamu</h1>
        <p class="subtitle">Masukkan tinggi badan & temukan ukuran sempurnamu</p>
      </div>

      <!-- Form -->
      <div class="input-group">
        <label for="inputNumber">
          <span class="label-icon">📏</span>
          Tinggi Badan
        </label>
        <div class="input-wrapper">
          <input
            type="number"
            id="inputNumber"
            placeholder="Contoh: 170"
            min="100"
            max="250"
            autocomplete="off"
          />
          <span class="input-unit">cm</span>
        </div>
        <span class="input-hint">Rentang: 100 – 250 cm</span>
        <span class="input-error" id="inputError" role="alert"></span>
      </div>

      <button type="button" id="btnHitung" onclick="result()">
        <span class="btn-icon">🔍</span>
        Hitung Ukuran Sepatu
        <span class="btn-shine"></span>
      </button>

      <!-- Result card -->
      <div class="result-card" id="resultCard" aria-live="polite">
        <div class="result-label">Ukuran Sepatu Kamu</div>
        <div class="result-number">
          <strong id="result">—</strong>
          <span class="result-unit">EU</span>
        </div>
        <div class="result-bar">
          <div class="result-bar-fill" id="resultBarFill"></div>
        </div>
      </div>

      <!-- Info footer -->
      <p class="info-note">
        ℹ️ Hasil merupakan perkiraan berdasarkan rumus proporsional tubuh.
      </p>

    </main>

    <script src="script.js"></script>
    <script>
      // Enhance result display with animations + input validation
      const originalResult = window.result;

      function validateInput() {
        const input = document.getElementById('inputNumber');
        const errorEl = document.getElementById('inputError');
        const val = Number(input.value);
        if (!input.value) {
          errorEl.textContent = '⚠️ Mohon masukkan tinggi badan kamu.';
          input.classList.add('input-invalid');
          return false;
        }
        if (val < 100 || val > 250) {
          errorEl.textContent = '⚠️ Tinggi badan harus antara 100 – 250 cm.';
          input.classList.add('input-invalid');
          return false;
        }
        errorEl.textContent = '';
        input.classList.remove('input-invalid');
        return true;
      }

      window.result = function () {
        if (!validateInput()) return;
        originalResult();
        const val = document.getElementById('result').innerHTML;
        const card = document.getElementById('resultCard');
        const bar = document.getElementById('resultBarFill');

        if (val && val !== '—' && !isNaN(Number(val))) {
          card.classList.add('has-result');
          // Map shoe size 30–50 to 0–100%
          const pct = Math.min(100, Math.max(0, ((Number(val) - 30) / 20) * 100));
          bar.style.width = pct + '%';
          // Animate number pop
          const strong = document.getElementById('result');
          strong.classList.remove('pop');
          void strong.offsetWidth; // reflow
          strong.classList.add('pop');
        }
      };

      // Enter key support
      document.getElementById('inputNumber').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') window.result();
      });

      // Clear error on typing
      document.getElementById('inputNumber').addEventListener('input', function () {
        document.getElementById('inputError').textContent = '';
        this.classList.remove('input-invalid');
      });
    </script>
  </body>
</html>
